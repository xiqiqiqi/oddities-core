  <path class="m-horn-dark m-outline" d="M76 66 C80 56 85 48 91 42 C92 52 90 61 86 69 Z"/>
  <path class="m-horn m-outline" d="M88 76 C92 58 98 44 106 30 C112 46 114 62 110 78 Z"/>

  <circle cx="70" cy="74" r="6.5" class="m-ink"/>
  <circle cx="67.8" cy="71.8" r="2" fill="#FFFFFF"/>
