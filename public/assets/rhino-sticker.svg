  <style>
    .m-cream { fill: var(--rhino-cream, #F4EFE6); }
    .m-horn { fill: var(--rhino-horn, #F3B34C); }
    .m-horn-dark { fill: var(--rhino-horn-dark, #DE9A34); }
    .m-blush { fill: var(--rhino-blush, #F4A3A3); opacity: .55; }
    .m-ink { fill: var(--rhino-ink, #2E2A26); }
    .m-outline {
      stroke: var(--rhino-ink, #2E2A26);
      stroke-width: 6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
